<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ValenMusik // Streaming</title>
<style>
  :root {
    --bg: #0f1110; /* Hitam kehijauan gelap */
    --panel: rgba(22, 26, 24, 0.85); /* Panel abu-abu gelap kehijauan */
    --border: rgba(136, 192, 168, 0.15); /* Border hijau pucat */
    --green: #4ade80; /* Hijau utama (Emerald) */
    --green-soft: #86efac; /* Hijau terang */
    --green-dim: #166534; /* Hijau gelap */
    --green-glow: rgba(74, 222, 128, 0.3);
    --text: #e2e8e4; /* Putih keabu-abuan */
    --muted: #849389; /* Abu-abu kehijauan */
    --font: 'Inter', 'Segoe UI', system-ui, -apple-system, sans-serif;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: var(--font);
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    overflow-x: hidden;
    padding-bottom: 180px; /* Ruang buat player & nav */
  }

  /* Background */
  .dash-bg {
    position: fixed;
    inset: 0;
    z-index: 0;
    background-image: url('assets/bg.jpg');
    background-size: cover;
    background-position: center;
    background-attachment: fixed;
  }
  .dash-overlay {
    position: fixed;
    inset: 0;
    z-index: 1;
    background: linear-gradient(180deg,
      rgba(15, 17, 16, 0.7) 0%,
      rgba(15, 17, 16, 0.6) 40%,
      rgba(15, 17, 16, 0.95) 100%);
    pointer-events: none;
  }

  /* Konten Utama */
  .wrap {
    position: relative;
    z-index: 2;
    max-width: 500px;
    margin: 0 auto;
    padding: 24px 16px;
  }

  .header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 24px;
  }
  .header h1 {
    font-size: 24px;
    font-weight: 800;
    background: linear-gradient(90deg, var(--green), var(--green-soft));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }
  .header a {
    color: var(--text);
    text-decoration: none;
    font-size: 12px;
    padding: 8px 12px;
    background: rgba(22, 26, 24, 0.7);
    border: 1px solid var(--border);
    border-radius: 8px;
    transition: 0.2s;
  }
  .header a:hover { border-color: var(--green); }

  .section-title {
    font-size: 16px;
    font-weight: 700;
    margin-bottom: 14px;
    color: var(--text);
  }

  /* Playlist Grid */
  .playlist-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 12px;
    margin-bottom: 24px;
  }

  .playlist-card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 12px;
    cursor: pointer;
    transition: all 0.25s ease;
    text-align: left;
  }
  .playlist-card:hover {
    background: rgba(30, 38, 34, 0.9);
    border-color: var(--green-dim);
    transform: translateY(-2px);
  }
  .playlist-card.active {
    border-color: var(--green);
    box-shadow: 0 0 15px var(--green-glow);
  }

  .playlist-cover {
    width: 100%;
    aspect-ratio: 1;
    background: rgba(15, 17, 16, 0.6);
    border-radius: 8px;
    margin-bottom: 10px;
    object-fit: cover;
    display: block;
  }
  
  .playlist-title {
    font-size: 13px;
    font-weight: 700;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .playlist-desc {
    font-size: 11px;
    color: var(--muted);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    margin-top: 2px;
  }

  /* Sticky Player di Bawah */
  .sticky-player {
    position: fixed;
    bottom: 74px; /* Di atas bottom nav */
    left: 50%;
    transform: translateX(-50%);
    width: calc(100% - 24px);
    max-width: 500px;
    background: rgba(22, 26, 24, 0.95);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 8px;
    z-index: 90;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .player-info {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 0 8px;
  }
  .player-now-playing {
    font-size: 12px;
    font-weight: 700;
    color: var(--green-soft);
  }
  .player-now-playing span {
    color: var(--muted);
    font-weight: 400;
  }

  /* Iframe Spotify */
  .spotify-iframe {
    width: 100%;
    height: 80px;
    border: none;
    border-radius: 10px;
    background: #000;
  }

  /* Bottom Nav */
  .bottom-nav {
    position: fixed;
    bottom: 12px;
    left: 50%;
    transform: translateX(-50%);
    width: calc(100% - 24px);
    max-width: 500px;
    background: rgba(22, 26, 24, 0.95);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 8px;
    display: flex;
    justify-content: space-around;
    z-index: 100;
  }
  .nav-item {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    text-decoration: none;
    color: var(--muted);
    font-size: 10px;
    font-weight: 600;
    padding: 6px;
    border-radius: 12px;
    transition: 0.2s;
    width: 60px;
  }
  .nav-item svg {
    width: 22px; height: 22px;
    stroke: currentColor;
    stroke-width: 1.8;
    fill: none;
    stroke-linecap: round;
    stroke-linejoin: round;
  }
  .nav-item.active {
    color: var(--green-soft);
  }
  .nav-item.active::after {
    content: '';
    width: 4px; height: 4px;
    border-radius: 50%;
    background: var(--green);
    box-shadow: 0 0 8px var(--green-glow);
  }
</style>
</head>
<body>

<div class="dash-bg"></div>
<div class="dash-overlay"></div>

<div class="wrap">
  
  <div class="header">
    <h1>ValenMusik</h1>
    <a href="https://v4l3n.web.id">Ke V4L3N &rarr;</a>
  </div>

  <div class="section-title">Playlist Pilihan</div>

  <div class="playlist-grid">
    
    <!-- PLAYLIST 1 -->
    <div class="playlist-card" onclick="playPlaylist(this, '37i9dQZF1DXcBWIGoYBM5M', 'Top Global')">
      <img class="playlist-cover" src="https://charts-images.scdn.co/assets/locale_en/regional/weekly/region_global_default.jpg" alt="Top Global">
      <div class="playlist-title">Top 50 Global</div>
      <div class="playlist-desc">Lagu paling populer dunia</div>
    </div>

    <!-- PLAYLIST 2 -->
    <div class="playlist-card" onclick="playPlaylist(this, '37i9dQZF1DX5Ejj0EkURtP', 'Lofi Beats')">
      <img class="playlist-cover" src="https://i.scdn.co/image/ab67706f00000002ca5a7517156021292e5663a6" alt="Lofi">
      <div class="playlist-title">Lofi Beats</div>
      <div class="playlist-desc">Santai & fokus</div>
    </div>

    <!-- PLAYLIST 3 -->
    <div class="playlist-card" onclick="playPlaylist(this, '37i9dQZF1DXdPec7aLTmlC', 'Hip-Hop')">
      <img class="playlist-cover" src="https://i.scdn.co/image/ab67706f000000029249b35f23fb596b6f006a15" alt="Hip Hop">
      <div class="playlist-title">Hip-Hop Central</div>
      <div class="playlist-desc">Beat & rhymes</div>
    </div>

    <!-- PLAYLIST 4 -->
    <div class="playlist-card" onclick="playPlaylist(this, '37i9dQZF1DXcF6B6QPhFDv', 'Rock Classics')">
      <img class="playlist-cover" src="https://i.scdn.co/image/ab67706f00000002c414e7daf34690c9f983f76e" alt="Rock">
      <div class="playlist-title">Rock Classics</div>
      <div class="playlist-desc">Legenda rock dunia</div>
    </div>

  </div>

</div>

<!-- STICKY PLAYER -->
<div class="sticky-player">
  <div class="player-info">
    <div class="player-now-playing" id="nowPlayingTitle">
      <span id="nowPlayingLabel">Pilih playlist dulu</span>
    </div>
  </div>
  <!-- Iframe ini bakal di-update lewat JS -->
  <iframe 
    id="spotifyPlayer" 
    class="spotify-iframe" 
    src="https://open.spotify.com/embed/playlist/37i9dQZF1DXcBWIGoYBM5M?utm_source=generator&theme=0" 
    allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture" 
    loading="lazy">
  </iframe>
</div>

<!-- BOTTOM NAV -->
<nav class="bottom-nav">
  <a class="nav-item active" href="/">
    <svg viewBox="0 0 24 24">
      <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
      <polyline points="9 22 9 12 15 12 15 22"/>
    </svg>
    <span>Home</span>
  </a>
  <a class="nav-item" href="#">
    <svg viewBox="0 0 24 24">
      <circle cx="11" cy="11" r="8"/>
      <line x1="21" y1="21" x2="16.65" y2="16.65"/>
    </svg>
    <span>Search</span>
  </a>
  <a class="nav-item" href="#">
    <svg viewBox="0 0 24 24">
      <path d="M9 18V5l12-2v13"/>
      <circle cx="6" cy="18" r="3"/>
      <circle cx="18" cy="16" r="3"/>
    </svg>
    <span>Library</span>
  </a>
</nav>

<script>
  function playPlaylist(cardEl, playlistId, playlistName) {
    // 1. Hapus class 'active' dari semua card
    const allCards = document.querySelectorAll('.playlist-card');
    allCards.forEach(c => c.classList.remove('active'));

    // 2. Tambah class 'active' ke card yang diklik
    cardEl.classList.add('active');

    // 3. Update judul di player
    document.getElementById('nowPlayingLabel').innerHTML = `Memutar: <strong style="color:var(--green-soft)">${playlistName}</strong>`;

    // 4. Update iframe Spotify
    const iframe = document.getElementById('spotifyPlayer');
    iframe.src = `https://open.spotify.com/embed/playlist/${playlistId}?utm_source=generator&theme=0`;
  }
</script>

</body>
</html>
